name: Microsoft Store Paketi (MSIX)

# Store'a gönderilecek rdpctl.msix paketini GERÇEK Windows'ta üretir.
# Paket imzalanmaz; Store gönderimde Microsoft imzalar.
# Partner Center kimlik değerleri repository variables olarak verilir:
#   MSIX_IDENTITY_NAME, MSIX_PUBLISHER, MSIX_PUBLISHER_DISPLAY_NAME, MSIX_DISPLAY_NAME
# Verilmezse yer tutucularla test paketi üretilir (Store'a gönderilemez).

on:
  workflow_dispatch:
  push:
    branches:
      - claude/**

permissions:
  contents: read

jobs:
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r requirements.txt

      - name: Relay adresini göm (ayarlıysa)
        run: python packaging/embed_relay.py
        env:
          RDPCTL_RELAY_HOST: ${{ vars.RDPCTL_RELAY_HOST }}
          RDPCTL_RELAY_PORT: ${{ vars.RDPCTL_RELAY_PORT }}

      - name: Build kimliğini göm
        run: python packaging/embed_build.py
        env:
          RDPCTL_BUILD_ID: ${{ github.sha }}

      - name: Uygulamayı klasör (onedir) olarak paketle
        run: pyinstaller --noconfirm packaging/rdpctl.spec
        env:
          RDPCTL_ONEDIR: "1"

      - name: MSIX klasörünü hazırla
        run: python packaging/msix/build_msix.py
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
          MSIX_VERSION: 1.0.${{ github.run_number }}.0

      - name: makeappx ile rdpctl.msix üret
        shell: pwsh
        run: |
          $mk = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
                Sort-Object FullName | Select-Object -Last 1
          if (-not $mk) { throw "makeappx.exe bulunamadi (Windows SDK)" }
          Write-Host "makeappx: $($mk.FullName)"
          & $mk.FullName pack /d build\msix_stage /p dist\rdpctl.msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx basarisiz ($LASTEXITCODE)" }
          Get-Item dist\rdpctl.msix | Format-List Name, Length

      - name: Paketi yükle (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: rdpctl-store-msix
          path: dist/rdpctl.msix
          if-no-files-found: error
