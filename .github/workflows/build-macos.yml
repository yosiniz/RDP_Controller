name: macOS Uygulamasi Derle

# rdpctl.app ve rdpctl-kaldir.app'i GERÇEK macOS sunucularinda uretir.
# Hem Apple Silicon (M serisi) hem Intel icin ayri ayri derler.
# Bitince "Actions" sekmesindeki calismanin altindaki "Artifacts"ten indirilir.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/**
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14      # Apple Silicon (M1/M2/M3)
            arch: apple-silicon
          - runner: macos-13      # Intel
            arch: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m pip install -r requirements.txt

      - name: Relay adresini göm (ayarlıysa)
        run: python packaging/embed_relay.py
        env:
          RDPCTL_RELAY_HOST: ${{ vars.RDPCTL_RELAY_HOST }}
          RDPCTL_RELAY_PORT: ${{ vars.RDPCTL_RELAY_PORT }}

      - name: Uygulamayı ve kaldırıcıyı paketle
        run: |
          pyinstaller --noconfirm packaging/rdpctl.spec
          pyinstaller --noconfirm packaging/rdpctl-kaldir.spec

      - name: .app paketlerini sıkıştır (izinleri korur)
        run: |
          cd dist
          ditto -c -k --keepParent rdpctl.app rdpctl-${{ matrix.arch }}.app.zip
          ditto -c -k --keepParent rdpctl-kaldir.app rdpctl-kaldir-${{ matrix.arch }}.app.zip
          shasum -a 256 *.zip > SHA256-${{ matrix.arch }}.txt
          cat SHA256-${{ matrix.arch }}.txt

      - name: Çıktıları yükle (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: rdpctl-macos-${{ matrix.arch }}
          path: |
            dist/rdpctl-${{ matrix.arch }}.app.zip
            dist/rdpctl-kaldir-${{ matrix.arch }}.app.zip
            dist/SHA256-${{ matrix.arch }}.txt
          if-no-files-found: error

      - name: Etiketlendiyse Release'e ekle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/rdpctl-${{ matrix.arch }}.app.zip
            dist/rdpctl-kaldir-${{ matrix.arch }}.app.zip
            dist/SHA256-${{ matrix.arch }}.txt
